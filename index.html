
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <main class="simulation">
    <h1>Conway's Game of Life</h1>
    <p class="description">
        Explore a cellular automaton where simple rules
        produce complex patterns.
    </p>

    <canvas id="canvas" width="1400" height="600"></canvas>

    <div class="controls">
        <button type="button" id="play">PLAY</button>
        <button type="button" id="pause">PAUSE</button>
        <button type="button" id="speed-up">SPEED UP</button>
        <button type="button" id="slow">SLOW DOWN</button>
        <button type="button" id="reset">RESET</button>
        <button type="button" id="randomise">RANDOMISE</button>
        <p id="speed">SPEED: 1x</p>
        <p id="gen">GENERATION: 0</p>
    </div>
</main>
</body>
</html>
